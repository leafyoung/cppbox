<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CPPBox</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#0f111a; color:#cdd6f4; }
  .title { font-size:16px; font-weight:700; }
  .url { color:#89b4fa; font-size:15px; font-weight:600; text-decoration:underline; cursor:pointer; }
  .dim { color:#6c7086; font-size:11px; text-align:center; max-width:380px; line-height:1.5; }
  button { background:#89b4fa; color:#0f111a; border:none; border-radius:6px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
</style>
</head>
<body>
  <div class="title">🐞 CPPBox is running</div>
  <a class="url" id="link" href="#">…</a>
  <button id="open">Open in browser</button>
  <div class="dim">The backend server runs locally. Click the link to open the IDE in your
  default browser. Closing this window stops the server.</div>
<script>
  (async function(){
    let port = 0;
    try { port = await window.__TAURI__.core.invoke('app_port'); } catch(e) {}
    const url = `http://127.0.0.1:${port}`;
    const link = document.getElementById('link');
    link.textContent = url;
    link.href = url;
    const open = () => { window.__TAURI__.core.invoke('open_browser', { url }); };
    link.addEventListener('click', e => { e.preventDefault(); open(); });
    document.getElementById('open').addEventListener('click', open);
  })();
</script>
</body>
</html>
