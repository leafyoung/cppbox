name: release

# Builds .exe/NSIS (windows) and .dmg (macos, arm64 + x86_64) via
# tauri-action, signs + uploads to the GitHub Release, and assembles the
# latest.json the in-app updater polls. Also pushes the cpp-sandbox image to
# ghcr.io. (Linux app build intentionally dropped.) Triggered by a `v*` tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # upload release assets + latest.json
  packages: write # push to ghcr.io

jobs:
  publish-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_target: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional until you run `tauri signer generate`; without these the
          # updater artifacts aren't signed (auto-update still installs unsigned
          # on linux/win; mac prompts). See DEPLOY.md.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CPPBox ${{ github.ref_name }}"
          releaseBody: "See the assets below to install. Auto-update is enabled if a signing key is configured."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-sandbox-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push cpp-sandbox image
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          docker buildx build --push \
            -t ghcr.io/leafyoung/cppbox-sandbox:"$TAG" \
            -t ghcr.io/leafyoung/cppbox-sandbox:latest \
            -f Dockerfile.sandbox .
