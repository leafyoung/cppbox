name: sandbox-image

# Publish the cpp-sandbox image to ghcr whenever the Dockerfile changes (or on
# demand). This keeps ghcr.io/leafyoung/cppbox-sandbox:latest in sync with the
# repo without waiting for a release tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile.sandbox']

permissions:
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: ghcr.io/leafyoung/cppbox-sandbox:latest
