# yaml-language-server: $schema=https://www.schemastore.org/prek.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(icon/|src-tauri/icons/)'
      - id: end-of-file-fixer
        exclude: '^(icon/|src-tauri/icons/)'
      - id: check-yaml
        exclude: '^src-tauri/gen/'
      - id: check-toml
      - id: check-json
        exclude: '^src-tauri/gen/'
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: local
    hooks:
      # Format the whole Rust workspace. prek aborts the commit if it rewrites
      # anything, so you re-stage the formatted files.
      - id: cargo-fmt
        name: cargo fmt (workspace)
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      # Syntax-check every staged .js file (worker/src/index.js and the
      # frontend/js/*.js ES modules) — node --check only accepts one file
      # at a time, so loop over whatever prek passes us.
      - id: js-syntax
        name: node --check (all JS files)
        entry: bash -c 'for f in "$@"; do node --check "$f" || exit 1; done' --
        language: system
        files: '\.js$'
        pass_filenames: true
